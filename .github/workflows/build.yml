name: Build and deploy site

on:
  schedule:
    # Daily at 05:00 UTC (= 08:00 Israel in summer / 07:00 in winter) — keeps the site
    # fresh every day. generate.mjs reads the newest WeeklyHoroscope per sign on each run,
    # so it always picks up the latest content Base44 produced. cron is UTC (no DST).
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node generate.mjs
        env:
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          APP_URL: ${{ vars.APP_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - id: deploy
        uses: actions/deploy-pages@v4
